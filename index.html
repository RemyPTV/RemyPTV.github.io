<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Melbourne Bus Routes Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --panel2:#212934; --text:#e7ecf2;
    --muted:#8b97a7; --accent:#ff8a3d; --accent2:#3dd6ff; --border:#2a3340;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;}
  #sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  #sidebar h1{font-size:16px;margin:0;padding:16px;border-bottom:1px solid var(--border);}
  #sidebar h1 span{color:var(--accent);}
  #controls{padding:12px 16px;border-bottom:1px solid var(--border);}
  #search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;}
  .filter-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;user-select:none;}
  .chip.active{background:var(--accent);color:#1a1005;border-color:var(--accent);font-weight:600;}
  #route-count{font-size:12px;color:var(--muted);padding:8px 16px 0 16px;}
  #route-list{flex:1;overflow-y:auto;padding:8px;}
  .route-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
  .route-item:hover{background:var(--panel2);}
  .route-item.selected{background:var(--panel2);outline:1px solid var(--accent);}
  .swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
  .route-num{font-weight:700;font-size:13px;min-width:38px;}
  .route-name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #map{flex:1;}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:8px;}
  .leaflet-popup-tip{background:var(--panel);}
  #legend{position:absolute;bottom:20px;left:20px;background:rgba(26,32,41,0.92);padding:10px 14px;border-radius:8px;font-size:12px;z-index:1000;border:1px solid var(--border);}
  #legend div{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #legend .dot{width:10px;height:10px;border-radius:50%;}
  #banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(26,32,41,0.92);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12px;color:var(--muted);z-index:1000;max-width:520px;text-align:center;}
  #banner b{color:var(--accent2);}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Melbourne <span>Bus</span> Routes</h1>
    <div id="controls">
      <input id="search" type="text" placeholder="Search route number or name..." />
      <div class="filter-row" id="type-filters"></div>
    </div>
    <div id="route-count"></div>
    <div id="route-list"></div>
  </div>
  <div id="map">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------------------------------------------------------
   DATA
   This is a small illustrative sample so the map works out of the box.
   Replace SAMPLE_ROUTES below with real data by fetching a routes.geojson
   file generated from the official PTV GTFS feed (see gtfs_to_geojson.py).
   Expected GeoJSON shape per feature:
     type: "Feature", geometry: LineString/MultiLineString,
     properties: { route_short_name, route_long_name, route_type: "bus"|"tram"|"train"|"nightbus" }
--------------------------------------------------------------- */
const SAMPLE_ROUTES = {
  type: "FeatureCollection",
  features: [
    feature("246","Clifton Hill – Elsternwick","bus","#ff8a3d",[
      [-37.7986,144.9958],[-37.8100,144.9900],[-37.8250,144.9880],[-37.8400,144.9910],[-37.8600,144.9950],[-37.8770,144.9990]
    ]),
    feature("903","SmartBus: Altona – Mordialloc","bus","#3dd6ff",[
      [-37.8670,144.8330],[-37.8500,144.8800],[-37.8300,144.9200],[-37.8600,144.9700],[-37.9100,145.0200],[-37.9800,145.0800]
    ]),
    feature("200","Melbourne University – Docklands","bus","#8afc7c",[
      [-37.7983,144.9614],[-37.8080,144.9560],[-37.8180,144.9500],[-37.8140,144.9400]
    ]),
    feature("216","Brighton – Melbourne University via St Kilda","bus","#ffd23d",[
      [-37.9060,144.9950],[-37.8830,144.9820],[-37.8680,144.9750],[-37.8300,144.9720],[-37.7983,144.9614]
    ]),
    feature("220","Sunshine – Melbourne University","bus","#ff5d8f",[
      [-37.7880,144.8320],[-37.7900,144.8700],[-37.7950,144.9100],[-37.7983,144.9614]
    ]),
    feature("905","SmartBus: Doncaster – East Malvern","bus","#c88bff",[
      [-37.7920,145.1250],[-37.8100,145.0900],[-37.8300,145.0500],[-37.8600,145.0300],[-37.8790,145.0350]
    ])
  ]
};

function feature(num,name,type,color,coords){
  return {
    type:"Feature",
    properties:{ route_short_name:num, route_long_name:name, route_type:type, color:color },
    geometry:{ type:"LineString", coordinates: coords.map(c=>[c[1],c[0]]) } // GeoJSON = [lng,lat]
  };
}

/* ---------------------------------------------------------------
   MAP SETUP
--------------------------------------------------------------- */
const map = L.map('map', { zoomControl:false }).setView([-37.8136,144.9631], 11);
L.control.zoom({ position:'bottomright' }).addTo(map);

L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2k3x_1_695cbe2fee54ca100951c65c', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','');
  div.id = 'legend';
  div.innerHTML = `<div><b>Route type</b></div>
    <div><span class="dot" style="background:#ff8a3d"></span> Bus</div>
    <div><span class="dot" style="background:#3dd6ff"></span> SmartBus</div>`;
  return div;
};
legend.addTo(map);

let routesLayer;
let allFeatures = [];
let selectedId = null;
const activeTypes = new Set();

function routeId(props){ return props.route_short_name + '|' + props.route_long_name; }

function styleFor(props, isSelected){
  return {
    color: props.color || '#ff8a3d',
    weight: isSelected ? 6 : 3,
    opacity: isSelected ? 1 : 0.75
  };
}

function loadGeoJSON(geojson){
  if (routesLayer) map.removeLayer(routesLayer);
  allFeatures = geojson.features;

  routesLayer = L.geoJSON(geojson, {
    style: f => styleFor(f.properties, false),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindPopup(`<b>${p.route_short_name}</b><br>${p.route_long_name}<br><span style="color:#8b97a7">${p.route_type}</span>`);
      layer.on('click', () => selectRoute(routeId(p)));
      layer.on('mouseover', () => { if (routeId(p) !== selectedId) layer.setStyle({ weight:5, opacity:1 }); });
      layer.on('mouseout', () => { if (routeId(p) !== selectedId) layer.setStyle(styleFor(p,false)); });
    }
  }).addTo(map);

  buildTypeFilters();
  renderList();
}

function eachLayer(cb){
  routesLayer.eachLayer(layer => cb(layer, layer.feature.properties));
}

function selectRoute(id){
  selectedId = (selectedId === id) ? null : id;
  eachLayer((layer, p) => {
    const isSel = routeId(p) === selectedId;
    layer.setStyle(styleFor(p, isSel));
    if (isSel) layer.bringToFront();
  });
  if (selectedId){
    eachLayer((layer, p) => { if (routeId(p) === selectedId) map.fitBounds(layer.getBounds(), { padding:[60,60] }); });
  }
  renderList();
}

function buildTypeFilters(){
  const types = [...new Set(allFeatures.map(f => f.properties.route_type))];
  types.forEach(t => activeTypes.add(t));
  const wrap = document.getElementById('type-filters');
  wrap.innerHTML = '';
  types.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.textContent = t;
    chip.onclick = () => {
      if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
      chip.classList.toggle('active');
      applyFilters();
    };
    wrap.appendChild(chip);
  });
}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  eachLayer((layer, p) => {
    const matchesType = activeTypes.has(p.route_type);
    const matchesSearch = !q || p.route_short_name.toLowerCase().includes(q) || p.route_long_name.toLowerCase().includes(q);
    const show = matchesType && matchesSearch;
    layer.setStyle({ opacity: show ? (routeId(p)===selectedId?1:0.75) : 0, fillOpacity:0 });
  });
  renderList();
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('route-list');
  list.innerHTML = '';
  const visible = allFeatures.filter(f => {
    const p = f.properties;
    const matchesType = activeTypes.has(p.route_type);
    const matchesSearch = !q || p.route_short_name.toLowerCase().includes(q) || p.route_long_name.toLowerCase().includes(q);
    return matchesType && matchesSearch;
  }).sort((a,b) => a.properties.route_short_name.localeCompare(b.properties.route_short_name, undefined, {numeric:true}));

  document.getElementById('route-count').textContent = `${visible.length} route${visible.length===1?'':'s'}`;

  visible.forEach(f => {
    const p = f.properties;
    const item = document.createElement('div');
    item.className = 'route-item' + (routeId(p)===selectedId ? ' selected' : '');
    item.innerHTML = `<div class="swatch" style="background:${p.color}"></div>
      <div class="route-num">${p.route_short_name}</div>
      <div class="route-name">${p.route_long_name}</div>`;
    item.onclick = () => selectRoute(routeId(p));
    list.appendChild(item);
  });
}

document.getElementById('search').addEventListener('input', applyFilters);

/* ---------------------------------------------------------------
   Try to load a real routes.geojson placed next to this file first;
   fall back to the built-in sample data if it's not found.
--------------------------------------------------------------- */
fetch('routes.geojson')
  .then(r => { if (!r.ok) throw new Error('no file'); return r.json(); })
  .then(loadGeoJSON)
  .catch(() => loadGeoJSON(SAMPLE_ROUTES));
</script>
</body>
</html>
