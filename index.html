<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Melbourne Bus Routes Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="app">
    <div id="sidebar">
      <h1>Melbourne <span>Bus</span> Routes</h1>
      <div id="controls">
        <input id="search" type="text" placeholder="Search route number or name..." />
        <div class="filter-row" id="type-filters"></div>
        <div class="toggle-row"><input type="checkbox" id="toggle-numbers" checked> <label for="toggle-numbers">Numbers
            on lines (zoom in)</label></div>
        <div class="toggle-row"><input type="checkbox" id="toggle-stops" checked> <label for="toggle-stops">Stops (zoom
            in)</label></div>
        <div class="toggle-row"><input type="checkbox" id="toggle-exchanges" checked> <label for="toggle-exchanges">Bus
            exchanges (always visible)</label></div>
      </div>
      <div id="route-count"></div>
      <div id="route-list"></div>
    </div>
    <div id="map">
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
